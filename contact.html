        <div class="nav-dropdown-menu">
          <a href="https://jeroenirene.nl/wp/354-2/">Agenda</a>
          <a href="https://jeroenirene.nl/wp/fotovideo/">Foto &amp; Video</a>

      <span></span><span></span><span></span>

  <div class="mobile-backdrop"></div>
  <nav class="mobile-panel" aria-label="Mobiele navigatie" aria-hidden="true">
    <button class="menu-close" type="button" aria-label="Menu sluiten">&times;</button>

  <main class="contact-main">
    <section class="contact-section">
      <div class="contact-inner">
        <h1>Contact</h1>
        <p>Heb je een vraag of verzoek?<br>Vul dan onderstaand formulier in en we nemen z.s.m. contact met je op!</p>
        <form class="contact-form" action="https://formsubmit.co/jeroenirenemuziek@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="Nieuw contactbericht via jeroenirene.nl">
          <input type="hidden" name="_captcha" value="false">
          <label>
            <span>Naam</span>
            <input type="text" name="naam" autocomplete="name" required>
          </label>
          <label>
            <span>E-mailadres</span>
            <input type="email" name="email" autocomplete="email" required>
          </label>
          <label>
            <span>Bericht</span>
            <textarea name="bericht" rows="6" required></textarea>
          </label>
          <button type="submit">Verstuur bericht</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">© 2026 Jeroen &amp; Irene</footer>
  <script src="script.js"></script>
